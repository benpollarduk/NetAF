name: release

on:
  workflow_dispatch:
    branches:
      - main
    inputs:
      ver:
        description: 'The version number, should be specified as a semantic version e.g: X.Y.Z'
        required: true
      release-notes:
        description: 'The versions release notes'
        required: true

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0'

jobs:
  build:
    runs-on: windows-latest

    steps:

    - name: Restrict to owner
      if: github.actor != 'benpollarduk'
      run: |
        echo "Access denied for user ${{ github.actor }}"
        exit 1

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
       repository: benpollarduk/NetAF
       token: ${{ secrets.PAT }}

    - name: Setup environment
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install dependencies
      run: dotnet restore

    - name: Install node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Update docfx
      run: dotnet tool update -g docfx

    - name: Update version and release notes in csproj file
      shell: pwsh
      run: |
        Write-Host "Version: ${{ inputs.ver }}"
        Write-Host "Release notes: ${{ inputs.release-notes }}"

        $csproj = "NetAF/NetAF.csproj"
        $content = Get-Content $csproj -Raw

        # update the .csproj file with the input version
        $content = $content -replace '<Version>.*?</Version>', '<Version>${{ inputs.ver }}</Version>'
        $content = $content -replace '<AssemblyVersion>.*?</AssemblyVersion>', '<AssemblyVersion>${{ inputs.ver }}.0</AssemblyVersion>'
        $content = $content -replace '<FileVersion>.*?</FileVersion>', '<FileVersion>${{ inputs.ver }}</FileVersion>'

        # update the .csproj file with the release notes
        $content = $content -replace '<PackageReleaseNotes>.*?</PackageReleaseNotes>', '<PackageReleaseNotes>${{ inputs.release-notes }}</PackageReleaseNotes>'

        Set-Content $csproj $content

    - name: Build
      run: dotnet build .\NetAF\NetAF.csproj -c Release

    - name: Run tests with coverlet
      run: dotnet test .\NetAF.Tests\NetAF.Tests.csproj /p:CollectCoverage=true /p:CoverletOutput=TestResults/ /p:CoverletOutputFormat=lcov

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Publish applications
      run: dotnet publish -c Release

    - name: Push NuGet package (GitHub)
      run: |
        dotnet nuget push .\NetAF\bin\Release\*.nupkg --api-key ${{ secrets.PAT }} --source https://nuget.pkg.github.com/benpollarduk/index.json
    
    - name: Push NuGet package (NuGet.org)
      run: |
        dotnet nuget push .\NetAF\bin\Release\*.nupkg --api-key ${{ secrets.NUGET_TOKEN }} --source https://api.nuget.org/v3/index.json

    - name: Tag the commit
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag -a "${{ inputs.ver }}" -m "${{ inputs.ver }} tagged during GitHub action"
        git push --tags

    - name: Build documentation
      continue-on-error: true
      run: docfx docs\docfx\docfx.json

    - name: Copy website files, commit and tag, then push changes to NetAF-docs
      continue-on-error: true
      shell: bash
      run: |
        mkdir NetAF-docs
        cd NetAF-docs
        git init
        git remote add origin https://${{ secrets.PAT }}@github.com/benpollarduk/NetAF-docs.git
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git fetch
        git checkout main
        git rm -r --ignore-unmatch .
        cp -r ../docs/docfx/_site/* .
        git add .
        git commit -m "Update documentation"
        git tag -a "${{ inputs.ver }}" -m "${{ inputs.ver }} tagged during GitHub action"
        git push --follow-tags https://${{ secrets.PAT }}@github.com/benpollarduk/NetAF-docs.git HEAD:main

    - name: Create GitHub release
      uses: actions/create-release@v1
      with:
        tag_name: "${{ inputs.ver }}"
        release_name: "${{ inputs.ver }}"
        body: "${{ inputs.release-notes }}"
      env:
        GITHUB_TOKEN: ${{ secrets.PAT }}

    - name: Upload Console App to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.PAT }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }} 
        asset_path: NetAF.Example.Console\bin\Release\net10.0\win-x64\publish\NetAF.Example.Console.exe
        asset_name: NetAF.Example.Console.exe
        asset_content_type: application/octet-stream

    - name: Upload WPF App to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.PAT }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }} 
        asset_path: NetAF.Example.WPF\bin\Release\net10.0-windows\win-x64\publish\NetAF.Example.WPF.exe
        asset_name: NetAF.Example.WPF.exe
        asset_content_type: application/octet-stream
